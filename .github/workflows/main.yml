               r'''#ifdef __ANDROID__
          // Video > Performance > Render distance: the main camera's far plane (a projection with near 1 and far 25000 - found as
          // the widescreen code finds it) at 75%, 50% or 30%, never under 3000. The game's own culling follows its frustum. The
          // first far plane seen stays the original, so Normal puts it back at the next rebuild.
          static void persp_far_limit(uint64_t proj) {
              static const float share[4] = {1.0f, 0.75f, 0.5f, 0.3f};
              static struct { uint64_t proj; float orig, last; } seen[16];
              static int nseen;
              int lv = g_settings.render_dist;
              if (lv < 0 || lv > 3) lv = 0;
              float *p = (float *)(uintptr_t)(proj + 0x98);  // near, far, fovy
              int k = -1;
              for (int i = 0; i < nseen; i++) if (seen[i].proj == proj) { k = i; break; }
              if (k < 0) {
                  if (!lv || nseen == 16) return;
                  if (!(p[0] > 0.0f && p[0] <= 5.0f && p[1] >= 10000.0f && p[1] <= 200000.0f)) return;
                  seen[nseen].proj = proj, seen[nseen].orig = seen[nseen].last = p[1], k = nseen++;
              } else if (p[1] != seen[k].last) {  // the game set a far plane of its own (or the address is another object's now)
                  if (!(p[0] > 0.0f && p[0] <= 5.0f && p[1] >= 10000.0f && p[1] <= 200000.0f)) { seen[k].proj = 0; return; }
                  seen[k].orig = p[1];
              }
              float f = lv ? seen[k].orig * share[lv] : seen[k].orig;
              if (f < 3000.0f) f = 3000.0f;
              if (p[1] != f) {
                  p[1] = f;
                  LOG("[widescreen] render distance %d: far plane %.0f\n", lv, f);
              }
              seen[k].last = f;
          }
