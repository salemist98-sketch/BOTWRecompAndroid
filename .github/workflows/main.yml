          static void fx_log(uint64_t h, uint32_t ninst) {
              static struct { uint64_t h; uint32_t n, inst; } tab[64];
              static int ntab;
              static uint64_t start_frame;
              uint64_t f = renderer_present_count();
              if (!start_frame) start_frame = f;
              int k = -1;
              for (int i = 0; i < ntab; i++) if (tab[i].h == h) { k = i; break; }
              if (k < 0 && ntab < 64) {
                  k = ntab++;
                  tab[k].h = h, tab[k].inst = ninst;
                  const uint8_t *b = st.blend[0];
