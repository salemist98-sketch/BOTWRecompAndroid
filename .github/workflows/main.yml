name: Build APK (test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VERSION: 30.0.16248370
      CMAKE_VERSION: 3.30.4
    steps:
      - name: Check out the code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install helper tools
        run: sudo apt-get update && sudo apt-get install -y bzip2 patch xz-utils

      - name: Install the Android NDK, CMake and platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36"
          # The runner has its own NDK variables; point them at the version the project needs
          {
            echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Restore prebuilt libraries (if cached)
        uses: actions/cache@v4
        with:
          path: android/deps/out
          key: deps-${{ hashFiles('android/deps/build_deps.sh', 'android/deps/build_ffmpeg.sh', 'android/deps/sdl-aaudio-resume.patch') }}

      - name: Build SDL3, shaderc and headers
        run: bash android/deps/build_deps.sh

      - name: Build FFmpeg
        run: |
          if [ ! -f android/deps/out/lib/libavcodec.so ]; then
            ANDROID_NDK_LINUX="$ANDROID_HOME/ndk/$NDK_VERSION" bash android/deps/build_ffmpeg.sh
          fi

      - name: Apply our changes (frame profiler switch)
        run: |
          cat > /tmp/prof-toggle.patch <<'PATCH_EOF'
          diff --git a/runtime/nvn/vulkan/exec.c b/runtime/nvn/vulkan/exec.c
          index a7afd32..c5d20a8 100644
          --- a/runtime/nvn/vulkan/exec.c
          +++ b/runtime/nvn/vulkan/exec.c
          @@ -1469,2 +1469,5 @@ void vk_exec_init(void) {
               prof = getenv("LARECOMP_VK_PROF") != NULL;
          +#ifdef __ANDROID__
          +    if (g_settings.vk_prof) prof = 1;  // (the start screen's Settings > Prelaunch > Frame profiler)
          +#endif
           #ifdef __ANDROID__
          diff --git a/runtime/settings.c b/runtime/settings.c
          index 5cdcdbb..e10d322 100644
          --- a/runtime/settings.c
          +++ b/runtime/settings.c
          @@ -276,2 +276,3 @@ void settings_load(void) {
                   else if (!strcmp(key, "log_file")) g_settings.log_file = atoi(val) != 0;
          +        else if (!strcmp(key, "vk_prof")) g_settings.vk_prof = atoi(val) != 0;
                   else if (!strcmp(key, "gpu_model")) snprintf(g_settings.gpu_model, sizeof g_settings.gpu_model, "%s", val);
          diff --git a/runtime/settings.h b/runtime/settings.h
          index 1094345..37fe46e 100644
          --- a/runtime/settings.h
          +++ b/runtime/settings.h
          @@ -58,2 +58,3 @@ typedef struct {
               bool log_file;        // the log in a file as well (platform/android.c), to send with a report
          +    bool vk_prof;         // the frame profiler (vulkan/exec.c, LARECOMP_VK_PROF): where each frame's CPU time goes, in the log; read when the game starts
               char gpu_model[64];   // the GPU of the last start ("Adreno (TM) 830v1"): turnip_lrz's Automatic, before the driver
          diff --git a/runtime/ui/launcher.mm b/runtime/ui/launcher.mm
          index c15eef9..553e7a5 100644
          --- a/runtime/ui/launcher.mm
          +++ b/runtime/ui/launcher.mm
          @@ -1658,2 +1658,8 @@ static void prelaunch_tab(float sc) {
                   ImGui::PopID();
          +        ImGui::Spacing();
          +        if (ImGui::Checkbox(tr("Frame profiler"), &g_settings.vk_prof)) changed = true;
          +        ImGui::TextDisabled("%s", tr("Adds to the log where each frame's time goes (draw setup, pipelines, descriptor sets, "
          +                                  "textures, vertices, GPU) and lists every frame over 50 ms. It slows the game a "
          +                                  "little and makes the log longer: for bug reports only. Applies the next time the "
          +                                  "game starts."));
                   ImGui::PopTextWrapPos();
          PATCH_EOF
          git apply --verbose /tmp/prof-toggle.patch
          # saving the setting: inserted after the show_fps line, wherever that is now
          python3 - <<'PY_EOF'
          p = 'runtime/settings.c'
          s = open(p, encoding='utf-8').read()
          old = 'fprintf(f, "show_fps = %d\\n", g_settings.show_fps);'
          assert s.count(old) == 1, 'show_fps save line not found exactly once'
          j = s.index('\n', s.index(old)) + 1
          s = s[:j] + '#ifdef __ANDROID__\n    fprintf(f, "vk_prof = %d\\n", g_settings.vk_prof);\n#endif\n' + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          PY_EOF
          # the frame profiler also asks for the GPU time per pass of one frame in 600 (the "[gpuprof]" lines)
          python3 - <<'PY_EOF2'
          p = 'runtime/nvn/vulkan/device.c'
          s = open(p, encoding='utf-8').read()
          old = 'const char *e = getenv("LARECOMP_GPUPROF_AT");'
          assert s.count(old) == 1, 'GPUPROF_AT line not found exactly once'
          i = s.index(old)
          ins = '#ifdef __ANDROID__\n        if (g_settings.vk_prof && total_frames % 600 == 300) g_gpuprof_frame = true;\n#endif\n        '
          s = s[:i] + ins + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          PY_EOF2
          git diff --stat

      - name: Make this a separate app (so your installed one is not replaced)
        run: |
          sed -i 's|applicationId = "com.botwrecomp.android"|applicationId = "com.botwrecomp.android.test"|' android/botwrecompandroid/app/build.gradle.kts
          grep -n applicationId android/botwrecompandroid/app/build.gradle.kts

      - name: Build the APK
        working-directory: android/botwrecompandroid
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: botw-apk
          path: android/botwrecompandroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
