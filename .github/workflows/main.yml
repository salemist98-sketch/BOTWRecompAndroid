          // instances, never under one. It does nothing to a grass draw of one instance. Frame profiler: the first draw of each
          // grass shader is listed ([grassdraw]: indexed, vertex count, instances) - what a distance setting for grass would need.
          static uint32_t grass_thin_inst(Prog *pr, uint32_t n, uint32_t count, bool indexed) {
              int lv = g_settings.grass_density;
              if (lv <= 0 && !g_settings.vk_prof) return n;
              if (!draw_is_grass(pr)) return n;
              if (g_settings.vk_prof) {
                  static uint64_t seen[48];
                  static int ns;
                  uint64_t vs = st.program->stages[0].code_addr;
                  bool known = false;
                  for (int i = 0; i < ns; i++) if (seen[i] == vs) { known = true; break; }
                  if (!known && ns < 48) {
                      seen[ns++] = vs;
                      LOG("[grassdraw] vertex shader %llx: %s, %u vertices, %u instances\n", (unsigned long long)vs, indexed ? "indexed" : "not indexed", count, n);
                  }
              }
              if (lv <= 0 || n < 2) return n;
              uint32_t k = n * (uint32_t)(lv == 1 ? 75 : lv == 2 ? 50 : 25) / 100;
              return k < 1 ? 1 : k;
          }
          ''')
          edit(X, 'inst = geo_thin_inst((uint32_t)r->x[4] ? (uint32_t)r->x[4] : 1);\n',
               'inst = grass_thin_inst(pr, geo_thin_inst((uint32_t)r->x[4] ? (uint32_t)r->x[4] : 1), count, false);\n')
          edit(X, 'inst = geo_thin_inst((uint32_t)r->x[6] ? (uint32_t)r->x[6] : 1);\n',
               'inst = grass_thin_inst(pr, geo_thin_inst((uint32_t)r->x[6] ? (uint32_t)r->x[6] : 1), count, true);\n')

          M = 'runtime/ui/menu.mm'
          edit(M, '        static const char *ur[] = {"Every frame", "Every 2nd frame", "Every 4th frame"};\n',
               r'''        static const char *gdn[] = {"Full", "75%", "50%", "25%"};
                  if (opt_choice("Grass density", &g_settings.grass_density, gdn, 4, 0,
                                 "How much of the grass is drawn: an instanced grass draw draws 75%, 50% or 25% of its instances (it is found as Skip "
                                 "grass finds it). The last instances go, so a whole patch can thin out or go bare instead of every blade thinning. "
                                 "Not a distance: the game decides what is drawn. With the Frame profiler on, the log shows how the grass is drawn "
                                 "([grassdraw] lines). Applies at once.", false))
                      settings_save();
                  static const char *ur[] = {"Every frame", "Every 2nd frame", "Every 4th frame"};
          ''')
          edit(M, 'g_settings.shadow_rate = 0; g_settings.mip_bias = 0; g_settings.pipe_limit = 0;\n',
               'g_settings.shadow_rate = 0; g_settings.mip_bias = 0; g_settings.pipe_limit = 0; g_settings.grass_density = 0;\n')
          print('round 6 applied')
          PY_ROUND6
          python3 /tmp/round6.py
          git diff --stat

      - name: Apply grass and character distance
        run: |
          cat > /tmp/round7.py <<'PY_ROUND7'
          # Round 7: Grass distance and Character distance. Run from the repository root, after round 6.
          #   A vertex shader found to draw grass (Skip grass's test) or a skinned character (an unsigned-integer vertex input:
          #   bone indices) is translated a second way with gl_ClipDistance[0] = limit - gl_Position.w, so whatever is farther from
          #   the camera than the limit (w is the depth in game units, taken to be metres) is clipped there: cleanly, a triangle
          #   across the limit is cut, not stretched. The variant is used once it is built; until then the draw is as it was.
          def edit(path, old, new, count=1):
              s = open(path, encoding='utf-8').read()
              assert s.count(old) == count, (path, 'anchor found %d times' % s.count(old), old[:80])
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))

          # ---- the key and the translator ---------------------------------------------------------------------------------------
          edit('runtime/nvn/maxwell/shader.h', '    bool gmem_linear_lookup;  // Qualcomm compute: cached linear GMap lookup avoids its compiler\'s binary-search failure\n',
               '    bool gmem_linear_lookup;  // Qualcomm compute: cached linear GMap lookup avoids its compiler\'s binary-search failure\n'
               '    uint8_t cull_depth;       // vertex (GLSL): clip what is farther than this x 2 game units from the camera (gl_ClipDistance on w).\n'
               '                              // (In the tail padding: the key is the same size, and 0 hashes as before.)\n')
          edit('runtime/nvn/maxwell/translate.c',
               '        if (key && key->depth_minus_one) sp(&s, "  gl_Position.z = (gl_Position.z + gl_Position.w) * 0.5f;\\n");\n    } else if (stage == STAGE_FRAGMENT) {\n',
               '        if (key && key->depth_minus_one) sp(&s, "  gl_Position.z = (gl_Position.z + gl_Position.w) * 0.5f;\\n");\n'
               '        if (key && key->cull_depth) sp(&s, "  gl_ClipDistance[0] = %d.0 - gl_Position.w;\\n", (int)key->cull_depth * 2);  // (Grass / Character distance)\n'
               '    } else if (stage == STAGE_FRAGMENT) {\n')

          # ---- the device: is gl_ClipDistance there ------------------------------------------------------------------------------
          D = 'runtime/nvn/vulkan/device.c'
          edit(D, 'VkG g_vk;\n', 'VkG g_vk;\nbool g_clip_distance_ok;  // the GPU has shaderClipDistance (enabled below): Grass / Character distance need it\n')
          edit(D, '    b->shaderClipDistance = h->shaderClipDistance;\n',
               '    b->shaderClipDistance = h->shaderClipDistance;\n    g_clip_distance_ok = h->shaderClipDistance != 0;\n')

          # ---- settings ---------------------------------------------------------------------------------------------------------
          edit('runtime/settings.h', '    bool vk_prof;',
               '    int grass_dist;       // Grass distance: 0 normal, 1..4 a limit of 120 / 80 / 50 / 30 m (exec.c draw_cull_depth)\n'
               '    int char_dist;        // Character distance: 0 normal, 1..4 a limit of 150 / 100 / 70 / 50 m, for skinned meshes\n'
               '    bool vk_prof;')
          edit('runtime/settings.c', '        else if (!strcmp(key, "grass_density"))',
               '        else if (!strcmp(key, "grass_dist")) { int v = atoi(val); g_settings.grass_dist = v < 0 ? 0 : v > 4 ? 4 : v; }\n'
               '        else if (!strcmp(key, "char_dist")) { int v = atoi(val); g_settings.char_dist = v < 0 ? 0 : v > 4 ? 4 : v; }\n'
               '        else if (!strcmp(key, "grass_density"))')
          edit('runtime/settings.c', '    fprintf(f, "grass_density = %d\\n", g_settings.grass_density);\n',
               '    fprintf(f, "grass_density = %d\\ngrass_dist = %d\\nchar_dist = %d\\n", g_settings.grass_density, g_settings.grass_dist, g_settings.char_dist);\n')
          edit('runtime/settings.c', '    g_settings.grass_density = d->grass_density;\n',
               '    g_settings.grass_density = d->grass_density;\n    g_settings.grass_dist = d->grass_dist;\n    g_settings.char_dist = d->char_dist;\n')

          # ---- exec.c -----------------------------------------------------------------------------------------------------------
          X = 'runtime/nvn/vulkan/exec.c'
          edit(X, '    return k < 1 ? 1 : k;\n}\n',
               '    return k < 1 ? 1 : k;\n}\n' + r'''// Video > Performance > Grass distance, Character distance: what a draw's vertex shader is. The limits are in game units
          // (taken to be metres), as the ShaderKey's cull_depth x 2. A character is a vertex shader with an unsigned-integer input
          // (bone indices). Depth-only passes count when they are screen-shaped (the depth pre-pass must cut where the colour pass
          // does); the shadow maps are left alone. Frame profiler: each such vertex shader is listed once as [skinvs] / [grassvs].
          extern bool g_clip_distance_ok;
          static int draw_cull_depth(Prog *pr, const ShaderKey *vkey) {
              int gd = g_settings.grass_dist, cd = g_settings.char_dist;
              bool prof = g_settings.vk_prof;
              if ((!gd && !cd && !prof) || !g_clip_distance_ok || atomic_load(&pr->state) != 1 || !pr->vi) return 0;
              if (st.rt.ncolor < 1) {
                  if (!st.rt.depth || !st.rt.depth->height) return 0;
                  float a = (float)st.rt.depth->width / (float)st.rt.depth->height;
                  if (!(a >= 1.74f && a <= 1.81f)) return 0;
              }
              bool grass = draw_is_grass(pr);
              bool skinned = false;
              if (!grass) for (int i = 0; i < 32; i++) if (vkey->attr_kind[i] == 2) { skinned = true; break; }
              if (prof && (grass || skinned)) {
                  static uint64_t seen[96];
                  static int ns;
                  uint64_t vs = st.program->stages[0].code_addr;
                  bool known = false;
                  for (int i = 0; i < ns; i++) if (seen[i] == vs) { known = true; break; }
                  if (!known && ns < 96) {
                      seen[ns++] = vs;
                      LOG("[%s] vertex shader %llx: %d attributes, depth-only %d\n", grass ? "grassvs" : "skinvs", (unsigned long long)vs, st.nattrib,
                          st.rt.ncolor < 1);
                  }
              }
              static const uint8_t gt[5] = {0, 60, 40, 25, 15}, ct[5] = {0, 75, 50, 35, 25};
              if (grass) return gt[gd];
              return skinned ? ct[cd] : 0;
          }
          ''')
          edit(X, '    Prog *pr = get_program(st.program, &vkey, &fkey);\n    bool keep = false;',
               '    Prog *pr = get_program(st.program, &vkey, &fkey);\n' + r'''#ifdef __ANDROID__
              if (pr && (g_settings.grass_dist || g_settings.char_dist || g_settings.vk_prof)) {
                  int cdv = draw_cull_depth(pr, &vkey);
                  if (cdv) {  // (the variant with the limit, once it is built; until then the draw is as it was)
                      ShaderKey ck = vkey;
                      ck.cull_depth = (uint8_t)cdv;
                      Prog *cp = get_program(st.program, &ck, &fkey);
                      if (cp && atomic_load(&cp->state) == 1) pr = cp;
                  }
              }
          #endif
              bool keep = false;''')

          # ---- the menu ---------------------------------------------------------------------------------------------------------
          M = 'runtime/ui/menu.mm'
          edit(M, '        static const char *ur[] = {"Every frame", "Every 2nd frame", "Every 4th frame"};\n',
               r'''        static const char *dd[] = {"Normal", "Long", "Medium", "Short", "Very short"};
                  if (opt_choice("Grass distance", &g_settings.grass_dist, dd, 5, 0,
                                 "How far away grass is drawn: Long 120, Medium 80, Short 50, Very short 30 metres (the game's units, taken as "
                                 "metres). Farther grass is cut off at that line. If grass goes missing at your feet, the units are not metres: set "
                                 "Normal and tell me. Needs a GPU with clip distance (nearly all). Applies at once, after a short wait while new "
                                 "shaders build.", false))
                      settings_save();
                  if (opt_choice("Character distance", &g_settings.char_dist, dd, 5, 0,
                                 "How far away characters and animals (the meshes with bones: enemies, NPCs, wildlife) are drawn: Long 150, Medium "
                                 "100, Short 70, Very short 50 metres. A guess at which shaders those are - a far horse or a quest character can "
                                 "vanish with the rest. Experimental. Applies at once, after a short wait while new shaders build.", false))
                      settings_save();
                  static const char *ur[] = {"Every frame", "Every 2nd frame", "Every 4th frame"};
          ''')
          edit(M, 'g_settings.pipe_limit = 0; g_settings.grass_density = 0;\n',
               'g_settings.pipe_limit = 0; g_settings.grass_density = 0; g_settings.grass_dist = 0; g_settings.char_dist = 0;\n')
          print('round 7 applied')
          PY_ROUND7
          python3 /tmp/round7.py
          git diff --stat

      - name: Make this a separate app (so your installed one is not replaced)
        run: |
          sed -i 's|applicationId = "com.botwrecomp.android"|applicationId = "com.botwrecomp.android.test"|' android/botwrecompandroid/app/build.gradle.kts
          grep -n applicationId android/botwrecompandroid/app/build.gradle.kts

      - name: Custom app name and icon (optional)
        env:
          APP_NAME: ${{ inputs.app_name }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          cat > /tmp/app_identity.py <<'PY_IDENTITY'
          # Optional: the app's name and icon. Run from the repository root.
          #   APP_NAME   the name under the icon (empty: unchanged)
          #   ICON_URL   a link to a square PNG (empty: unchanged unless custom/app_icon.png is in the repository)
          # The icon is written as an adaptive icon (your picture over its own edge colour) and as the plain one for older Androids,
          # under the names the manifest already uses, so nothing else has to change.
          import os, re, sys, glob, io, urllib.request
          from xml.sax.saxutils import escape

          name = os.environ.get('APP_NAME', '').strip()
          icon_url = os.environ.get('ICON_URL', '').strip()
          icon_file = 'custom/app_icon.png'
          app = None
          for cand in glob.glob('android/**/src/main/AndroidManifest.xml', recursive=True):
              app = os.path.dirname(cand)
              break
          if not app:
              print('::warning::no AndroidManifest.xml found under android/: the name and icon stay as they are')
              sys.exit(0)
          res = os.path.join(app, 'res')
          manifest_path = os.path.join(app, 'AndroidManifest.xml')
          manifest = open(manifest_path, encoding='utf-8').read()

          # ---- the name ---------------------------------------------------------------------------------------------------------
          if name:
              done = 0
              android_str = name.replace('\\', '\\\\').replace("'", "\\'").replace('"', '\\"')
              if android_str[:1] in '@?':
                  android_str = '\\' + android_str
              for f in glob.glob(os.path.join(res, 'values*', '*.xml')):
                  s = open(f, encoding='utf-8').read()
                  n = re.sub(r'(<string\s+name="app_name"[^>]*>)[^<]*(</string>)', lambda m: m.group(1) + escape(android_str) + m.group(2), s)
                  if n != s:
                      open(f, 'w', encoding='utf-8').write(n)
                      done += 1
              # a label written straight into the manifest (not a @string reference)
              def lit(m):
                  return m.group(0) if m.group(2).startswith('@') else m.group(1) + escape(name, {'"': '&quot;'}) + '"'
              m2 = re.sub(r'(android:label=")([^"]*)"', lit, manifest)
              if m2 != manifest:
                  manifest = m2
                  open(manifest_path, 'w', encoding='utf-8').write(manifest)
                  done += 1
              print('app name "%s": %d place(s) changed' % (name, done))
              if not done:
                  print('::warning::no app_name string or literal label found: the name stays as it is')

          # ---- the icon ---------------------------------------------------------------------------------------------------------
          data = None
          if os.path.exists(icon_file):
              data = open(icon_file, 'rb').read()
              print('icon from', icon_file)
          elif icon_url:
              if not icon_url.startswith('https://'):
                  print('::warning::the icon link must start with https://: the icon stays as it is')
              else:
                  try:
                      req = urllib.request.Request(icon_url, headers={'User-Agent': 'Mozilla/5.0'})
                      data = urllib.request.urlopen(req, timeout=60).read(20 * 1024 * 1024)
                      print('icon from', icon_url)
                  except Exception as e:
                      print('::warning::could not download the icon (%s): it stays as it is' % e)
          if data:
              from PIL import Image
              src = Image.open(io.BytesIO(data)).convert('RGBA')
              w, h = src.size
              side = min(w, h)
              src = src.crop(((w - side) // 2, (h - side) // 2, (w - side) // 2 + side, (h - side) // 2 + side))  # (centre square)
              # the names the manifest uses
              names = set(re.findall(r'android:(?:icon|roundIcon)="@mipmap/([A-Za-z0-9_]+)"', manifest))
              if not names:
                  print('::warning::the manifest names no @mipmap icon: the icon stays as it is')
              else:
                  # the edge colour: the average of the picture's border pixels that are not see-through (white if none)
                  px = src.resize((64, 64)).load()
                  edge = [px[x, y] for x in range(64) for y in range(64) if (x in (0, 63) or y in (0, 63)) and px[x, y][3] > 200]
                  bg = tuple(sum(c[i] for c in edge) // len(edge) for i in range(3)) if edge else (255, 255, 255)
                  bg_hex = '#%02X%02X%02X' % bg
                  # adaptive icon: foreground = the picture at 70% of a transparent 432 px square (the mask shows the middle 66%)
                  fg = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
                  inner = src.resize((302, 302), Image.LANCZOS)
                  fg.paste(inner, (65, 65), inner)
                  os.makedirs(os.path.join(res, 'drawable-nodpi'), exist_ok=True)
                  fg.save(os.path.join(res, 'drawable-nodpi', 'custom_icon_fg.png'))
                  os.makedirs(os.path.join(res, 'values'), exist_ok=True)
                  open(os.path.join(res, 'values', 'custom_icon.xml'), 'w', encoding='utf-8').write(
                      '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="custom_icon_bg">%s</color>\n</resources>\n' % bg_hex)
                  for nm in names:
                      for old in glob.glob(os.path.join(res, 'mipmap-*', nm + '.*')) + glob.glob(os.path.join(res, 'drawable*', nm + '.*')):
                          os.remove(old)  # (one icon per name: no duplicate resource)
                      adaptive = ('<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                                  '    <background android:drawable="@color/custom_icon_bg"/>\n    <foreground android:drawable="@drawable/custom_icon_fg"/>\n'
                                  '</adaptive-icon>\n')
                      os.makedirs(os.path.join(res, 'mipmap-anydpi-v26'), exist_ok=True)
                      open(os.path.join(res, 'mipmap-anydpi-v26', nm + '.xml'), 'w', encoding='utf-8').write(adaptive)
                      for dens, px_ in (('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)):
                          d = os.path.join(res, 'mipmap-' + dens)
                          os.makedirs(d, exist_ok=True)
                          img = Image.new('RGBA', (px_, px_), bg + (255,))
                          small = src.resize((px_, px_), Image.LANCZOS)
                          img.paste(small, (0, 0), small)
                          if nm.endswith('round'):  # (a round one)
                              mask = Image.new('L', (px_ * 4, px_ * 4), 0)
                              from PIL import ImageDraw
                              ImageDraw.Draw(mask).ellipse((0, 0, px_ * 4 - 1, px_ * 4 - 1), fill=255)
                              img.putalpha(mask.resize((px_, px_), Image.LANCZOS))
                          img.save(os.path.join(d, nm + '.png'))
                  print('icon written for:', ', '.join(sorted(names)), 'edge colour', bg_hex)
          PY_IDENTITY
          python3 /tmp/app_identity.py

      - name: Restore the signing key (so new builds can update the old one)
        id: signkey
        uses: actions/cache@v4
        with:
          path: ~/.botwrecompandroid
          key: signing-key-v1

      - name: Create the signing key (only the first time)
        if: steps.signkey.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.botwrecompandroid
          keytool -genkeypair -keystore ~/.botwrecompandroid/test.jks -storepass botwtest123 -keypass botwtest123 -alias botwtest -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BOTW test build"
          printf 'storeFile=%s\nstorePassword=botwtest123\nkeyAlias=botwtest\nkeyPassword=botwtest123\n' "$HOME/.botwrecompandroid/test.jks" > ~/.botwrecompandroid/keystore.properties

      - name: Build the APK
        working-directory: android/botwrecompandroid
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: botw-apk
          path: android/botwrecompandroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
