name: Build APK (test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VERSION: 30.0.16248370
      CMAKE_VERSION: 3.30.4
    steps:
      - name: Check out the code and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Save a copy of the current source (for review)
        uses: actions/upload-artifact@v4
        with:
          name: runtime-source
          path: runtime

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install helper tools
        run: sudo apt-get update && sudo apt-get install -y bzip2 patch xz-utils

      - name: Install the Android NDK, CMake and platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36"
          # The runner has its own NDK variables; point them at the version the project needs
          {
            echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION"
          } >> "$GITHUB_ENV"

      - name: Restore prebuilt libraries (if cached)
        uses: actions/cache@v4
        with:
          path: android/deps/out
          key: deps-${{ hashFiles('android/deps/build_deps.sh', 'android/deps/build_ffmpeg.sh', 'android/deps/sdl-aaudio-resume.patch') }}

      - name: Build SDL3, shaderc and headers
        run: bash android/deps/build_deps.sh

      - name: Build FFmpeg
        run: |
          if [ ! -f android/deps/out/lib/libavcodec.so ]; then
            ANDROID_NDK_LINUX="$ANDROID_HOME/ndk/$NDK_VERSION" bash android/deps/build_ffmpeg.sh
          fi

      - name: Apply our changes (frame profiler switch)
        run: |
          cat > /tmp/prof-toggle.patch <<'PATCH_EOF'
          diff --git a/runtime/nvn/vulkan/exec.c b/runtime/nvn/vulkan/exec.c
          index a7afd32..c5d20a8 100644
          --- a/runtime/nvn/vulkan/exec.c
          +++ b/runtime/nvn/vulkan/exec.c
          @@ -1469,2 +1469,5 @@ void vk_exec_init(void) {
               prof = getenv("LARECOMP_VK_PROF") != NULL;
          +#ifdef __ANDROID__
          +    if (g_settings.vk_prof) prof = 1;  // (the start screen's Settings > Prelaunch > Frame profiler)
          +#endif
           #ifdef __ANDROID__
          diff --git a/runtime/settings.c b/runtime/settings.c
          index 5cdcdbb..e10d322 100644
          --- a/runtime/settings.c
          +++ b/runtime/settings.c
          @@ -276,2 +276,3 @@ void settings_load(void) {
                   else if (!strcmp(key, "log_file")) g_settings.log_file = atoi(val) != 0;
          +        else if (!strcmp(key, "vk_prof")) g_settings.vk_prof = atoi(val) != 0;
                   else if (!strcmp(key, "gpu_model")) snprintf(g_settings.gpu_model, sizeof g_settings.gpu_model, "%s", val);
          diff --git a/runtime/settings.h b/runtime/settings.h
          index 1094345..37fe46e 100644
          --- a/runtime/settings.h
          +++ b/runtime/settings.h
          @@ -58,2 +58,3 @@ typedef struct {
               bool log_file;        // the log in a file as well (platform/android.c), to send with a report
          +    bool vk_prof;         // the frame profiler (vulkan/exec.c, LARECOMP_VK_PROF): where each frame's CPU time goes, in the log; read when the game starts
               char gpu_model[64];   // the GPU of the last start ("Adreno (TM) 830v1"): turnip_lrz's Automatic, before the driver
          diff --git a/runtime/ui/launcher.mm b/runtime/ui/launcher.mm
          index c15eef9..553e7a5 100644
          --- a/runtime/ui/launcher.mm
          +++ b/runtime/ui/launcher.mm
          @@ -1658,2 +1658,8 @@ static void prelaunch_tab(float sc) {
                   ImGui::PopID();
          +        ImGui::Spacing();
          +        if (ImGui::Checkbox(tr("Frame profiler"), &g_settings.vk_prof)) changed = true;
          +        ImGui::TextDisabled("%s", tr("Adds to the log where each frame's time goes (draw setup, pipelines, descriptor sets, "
          +                                  "textures, vertices, GPU) and lists every frame over 50 ms. It slows the game a "
          +                                  "little and makes the log longer: for bug reports only. Applies the next time the "
          +                                  "game starts."));
                   ImGui::PopTextWrapPos();
          PATCH_EOF
          git apply --verbose /tmp/prof-toggle.patch
          # saving the setting: inserted after the show_fps line, wherever that is now
          python3 - <<'PY_EOF'
          p = 'runtime/settings.c'
          s = open(p, encoding='utf-8').read()
          old = 'fprintf(f, "show_fps = %d\\n", g_settings.show_fps);'
          assert s.count(old) == 1, 'show_fps save line not found exactly once'
          j = s.index('\n', s.index(old)) + 1
          s = s[:j] + '#ifdef __ANDROID__\n    fprintf(f, "vk_prof = %d\\n", g_settings.vk_prof);\n#endif\n' + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          PY_EOF
          # the frame profiler also asks for the GPU time per pass of one frame in 600 (the "[gpuprof]" lines)
          python3 - <<'PY_EOF2'
          p = 'runtime/nvn/vulkan/device.c'
          s = open(p, encoding='utf-8').read()
          old = 'const char *e = getenv("LARECOMP_GPUPROF_AT");'
          assert s.count(old) == 1, 'GPUPROF_AT line not found exactly once'
          i = s.index(old)
          ins = '#ifdef __ANDROID__\n        if (g_settings.vk_prof && total_frames % 600 == 300) g_gpuprof_frame = true;\n#endif\n        '
          s = s[:i] + ins + s[i:]
          open(p, 'w', encoding='utf-8').write(s)
          PY_EOF2
          # the frame profiler also turns on the pace trace: every 2 s, the game thread's and the render thread's busy ms per frame
          python3 - <<'PY_EOF3'
          p = 'runtime/nvn/vulkan/exec.c'
          s = open(p, encoding='utf-8').read()
          old = 'trace = e && atoi(e) != 0; }'
          assert s.count(old) == 1, 'pace trace line not found exactly once'
          s = s.replace(old, 'trace = (e && atoi(e) != 0) || g_settings.vk_prof; }')
          open(p, 'w', encoding='utf-8').write(s)
          PY_EOF3
          # the frame profiler also counts draws per fragment shader ([fshist] lines, every ~10 s)
          cat > /tmp/fs_hist.c <<'HELPER_EOF'
          #ifdef __ANDROID__
          // The frame profiler: draws per fragment shader. Every 300 frames (about 10 s) the 12 shaders with the most draws are logged
          // ([fshist]: shader hash, draws per frame), to see what a scene's thousands of draws are.
          static void fs_hist_note(uint64_t h) {
              static uint64_t hs[512];
              static uint32_t cs[512], total;
              static uint64_t start_frame;
              uint64_t f = renderer_present_count();
              if (!start_frame) start_frame = f;
              if (f - start_frame >= 300) {
                  double frames = (double)(f - start_frame);
                  char line[1024];
                  int n = snprintf(line, sizeof line, "[fshist] %.0f frames, %.0f draws a frame |", frames, total / frames);
                  for (int k = 0; k < 12; k++) {
                      int best = -1;
                      for (int i = 0; i < 512; i++)
                          if (cs[i] && (best < 0 || cs[i] > cs[best])) best = i;
                      if (best < 0 || n > (int)sizeof line - 48) break;
                      n += snprintf(line + n, sizeof line - n, " %016llx %.1f |", (unsigned long long)hs[best], cs[best] / frames);
                      cs[best] = 0;
                  }
                  LOG("%s\n", line);
                  memset(cs, 0, sizeof cs);
                  total = 0;
                  start_frame = f;
              }
              unsigned i = (unsigned)((h * 0x9E3779B97F4A7C15ull) >> 55);
              for (unsigned k = 0; k < 512; k++, i = (i + 1) & 511) {
                  if (cs[i] && hs[i] != h) continue;
                  hs[i] = h;
                  cs[i]++;
                  break;
              }
              total++;
          }
          #endif
          HELPER_EOF
          python3 - <<'PY_EOF4'
          p = 'runtime/nvn/vulkan/exec.c'
          s = open(p, encoding='utf-8').read()
          helper = open('/tmp/fs_hist.c', encoding='utf-8').read()
          anchor = 'static uint64_t prof_tp_;\n'
          assert s.count(anchor) == 1, 'prof_tp_ anchor not found exactly once'
          s = s.replace(anchor, helper + anchor)
          call = '        g_cur_fs_hash = last_hash;\n'
          assert s.count(call) == 1, 'g_cur_fs_hash line not found exactly once'
          s = s.replace(call, call + '#ifdef __ANDROID__\n        if (g_settings.vk_prof) fs_hist_note(last_hash);\n#endif\n')
          open(p, 'w', encoding='utf-8').write(s)
          PY_EOF4
          # Video tab > Performance: Skip shadows (moved here from Prelaunch), Disable grass, Texture quality, Anisotropic filtering
          cat > /tmp/grass_helper.c <<'HELPER_EOF2'
          #ifdef __ANDROID__
          // Video > Performance > Disable grass. A draw is taken for grass when its vertex shader reads an RGBA16 UNORM
          // texture (NVN format 0x2A): BOTW's grass does (the comment at vk_format_filters_linear, vulkan/textures.c). Judged
          // once per vertex shader; the first time one matches it is logged ("[grass] ...") so a wrong guess shows in the log.
          static bool draw_is_grass(Prog *pr) {
              static struct { uint64_t vs; uint8_t v; } memo[256];  // v: 1 grass, 2 not
              uint64_t vs = st.program->stages[0].code_addr;
              unsigned i = (unsigned)((vs * 0x9E3779B97F4A7C15ull) >> 56);
              if (memo[i].vs == vs && memo[i].v) return memo[i].v == 1;
              bool grass = false, all = true;
              if (pr->vi) for (int k = 0; k < pr->vi->ntex; k++) {
                  NvnTexture *t = shader_texture_object(0, &pr->vi->tex[k]);
                  if (!t) all = false;
                  else if (t->format == 0x2A) grass = true;
              }
              if (grass || all) {  // (a texture not bound yet: asked again at the next draw)
                  memo[i].vs = vs, memo[i].v = grass ? 1 : 2;
                  if (grass) LOG("[grass] vertex shader %llx reads an RGBA16 texture: its draws are skipped\n", (unsigned long long)vs);
              }
              return grass;
          }
          #endif
          HELPER_EOF2
          python3 - <<'PY_EOF5'
          def edit(path, old, new):
              s = open(path, encoding='utf-8').read()
              assert s.count(old) == 1, (path, old[:60])
              open(path, 'w', encoding='utf-8').write(s.replace(old, new))
          # the settings
          edit('runtime/settings.h',
               '    bool vk_prof;',
               '    bool skip_shadows;    // Video > Performance: the shadow maps (depth-only passes) are not drawn: less work, a world without shadows\n'
               '    bool skip_grass;      // Video > Performance: grass is not drawn (vulkan/exec.c draw_is_grass)\n'
               '    int tex_quality;      // Video > Performance > Texture quality: 0 Auto (low with RAM saving), 1 Low (half size), 2 Normal (vulkan/textures.c)\n'
               '    int aniso_cap;        // Video > Performance > Anisotropic filtering: 0 the game\'s own, 1 off, 2 / 4 / 8 at most (vulkan/textures.c)\n'
               '    bool vk_prof;')
          edit('runtime/settings.c',
               '        else if (!strcmp(key, "vk_prof")) g_settings.vk_prof = atoi(val) != 0;\n',
               '        else if (!strcmp(key, "vk_prof")) g_settings.vk_prof = atoi(val) != 0;\n'
               '        else if (!strcmp(key, "skip_shadows")) g_settings.skip_shadows = atoi(val) != 0;\n'
               '        else if (!strcmp(key, "skip_grass")) g_settings.skip_grass = atoi(val) != 0;\n'
               '        else if (!strcmp(key, "tex_quality")) { int v = atoi(val); g_settings.tex_quality = v == 1 || v == 2 ? v : 0; }\n'
               '        else if (!strcmp(key, "aniso_cap")) { int v = atoi(val); g_settings.aniso_cap = v == 1 || v == 2 || v == 4 || v == 8 ? v : 0; }\n')
          edit('runtime/settings.c',
               '    fprintf(f, "vk_prof = %d\\n", g_settings.vk_prof);\n',
               '    fprintf(f, "vk_prof = %d\\n", g_settings.vk_prof);\n'
               '    fprintf(f, "skip_shadows = %d\\nskip_grass = %d\\ntex_quality = %d\\naniso_cap = %d\\n", g_settings.skip_shadows,\n'
               '            g_settings.skip_grass, g_settings.tex_quality, g_settings.aniso_cap);\n')
          edit('runtime/settings.c',
               '    g_settings.files_in_place = d->files_in_place;\n',
               '    g_settings.files_in_place = d->files_in_place;\n'
               '    g_settings.skip_shadows = d->skip_shadows;\n'
               '    g_settings.skip_grass = d->skip_grass;\n'
               '    g_settings.tex_quality = d->tex_quality;\n'
               '    g_settings.aniso_cap = d->aniso_cap;\n')
          # the Video tab (ui/menu.mm tab_display), after the Rendering options
          edit('runtime/ui/menu.mm',
               '#endif\n    opt_end();\n}\n\nstatic void tab_audio(void) {',
               '    opt_section("Performance");\n'
               '    opt_toggle("Skip shadows (experimental)", &g_settings.skip_shadows, false,\n'
               '               "Does not draw the shadow maps: less work for the CPU and the GPU, and a world without shadows. Applies at once.");\n'
               '    opt_toggle("Disable grass (experimental)", &g_settings.skip_grass, false,\n'
               '               "Does not draw grass: less work for the CPU and the GPU, a bare ground. Grass is found by how it is drawn, so "\n'
               '               "something else may go with it; turn it off again if so. Applies at once.");\n'
               '    {\n'
               '        static const char *tq[] = {"Auto", "Low", "Normal"};\n'
               '        opt_choice("Texture quality", &g_settings.tex_quality, tq, 3, 0,\n'
               '                   "Low: block-compressed textures with mipmaps start at their second level - half the width and height, a quarter of the "\n'
               '                   "memory, softer textures. Normal: full size. Auto: Low where RAM saving is on, Normal otherwise. Normal on a phone with "\n'
               '                   "4 GB of RAM or less may run out of memory. Applies to textures loaded from now on: restart the game for all of them.",\n'
               '                   false);\n'
               '    }\n'
               '    {\n'
               '        static const char *an[] = {"Game\'s", "Off", "2x", "4x", "8x"};\n'
               '        static const int an_v[] = {0, 1, 2, 4, 8};\n'
               '        int ai = 0;\n'
               '        for (int i = 0; i < 5; i++) if (an_v[i] == g_settings.aniso_cap) ai = i;\n'
               '        if (opt_choice("Anisotropic filtering", &ai, an, 5, 0,\n'
               '                       "The most anisotropic filtering the game\'s textures get, for sharper ground and walls seen at a slant. Lower is "\n'
               '                       "lighter for the GPU. Game\'s: what the game asks for. Applies the next time the game starts.", false))\n'
               '            g_settings.aniso_cap = an_v[ai];\n'
               '    }\n'
               '#endif\n    opt_end();\n}\n\nstatic void tab_audio(void) {')
          # the draws (vulkan/exec.c)
          edit('runtime/nvn/vulkan/exec.c',
               '    if (prof) prof_tp_ = SDL_GetTicksNS();\n    if (!st.program) { stat_skipped++; return; }\n',
               '    if (prof) prof_tp_ = SDL_GetTicksNS();\n    if (!st.program) { stat_skipped++; return; }\n'
               '#ifdef __ANDROID__\n'
               '    if (g_settings.skip_shadows && st.rt.depth && st.rt.ncolor == 0) { stat_skipped++; return; }  // (depth-only: the shadow maps)\n'
               '#endif\n')
          helper = open('/tmp/grass_helper.c', encoding='utf-8').read()
          edit('runtime/nvn/vulkan/exec.c', 'static uint64_t prof_tp_;\n', helper + 'static uint64_t prof_tp_;\n')
          edit('runtime/nvn/vulkan/exec.c',
               '        for (int i = 0; i < nskip; i++) if (last_hash == skip[i]) { stat_skipped++; return; }\n',
               '        for (int i = 0; i < nskip; i++) if (last_hash == skip[i]) { stat_skipped++; return; }\n'
               '#ifdef __ANDROID__\n'
               '        if (g_settings.skip_grass && draw_is_grass(pr)) { stat_skipped++; return; }\n'
               '#endif\n')
          # the textures (vulkan/textures.c)
          edit('runtime/nvn/vulkan/textures.c',
               '#include "../texpatch.h"\n',
               '#include "../texpatch.h"\n#include "../../settings.h"\n')
          edit('runtime/nvn/vulkan/textures.c',
               '        static int half = -1;\n'
               '        if (half < 0) {\n'
               '            extern bool vk_low_ram(void);\n'
               '            const char *e = getenv("LARECOMP_HALF_TEXTURES");\n'
               '            half = e ? atoi(e) != 0 : vk_low_ram();\n'
               '            if (half) LOG("[vk] textures from their second level (half size): low RAM\\n");\n'
               '        }\n',
               '        static int half_auto = -1;\n'
               '        if (half_auto < 0) {\n'
               '            extern bool vk_low_ram(void);\n'
               '            const char *e = getenv("LARECOMP_HALF_TEXTURES");\n'
               '            half_auto = e ? atoi(e) != 0 : vk_low_ram();\n'
               '            if (half_auto) LOG("[vk] textures from their second level (half size): low RAM\\n");\n'
               '        }\n'
               '        // Video > Performance > Texture quality: 1 Low, 2 Normal, 0 Auto (the above); for textures made from now on\n'
               '        int half = g_settings.tex_quality == 1 ? 1 : g_settings.tex_quality == 2 ? 0 : half_auto;\n')
          edit('runtime/nvn/vulkan/textures.c',
               '    if (stest && mf > 1) { si.minLod = 0; si.maxLod = VK_LOD_CLAMP_NONE; si.anisotropyEnable = VK_TRUE; si.maxAnisotropy = 16; }\n',
               '    if (stest && mf > 1) { si.minLod = 0; si.maxLod = VK_LOD_CLAMP_NONE; si.anisotropyEnable = VK_TRUE; si.maxAnisotropy = 16; }\n'
               '    {   // Video > Performance > Anisotropic filtering: a cap on the game\'s own (samplers are made once: the next start)\n'
               '        int cap = g_settings.aniso_cap;\n'
               '        if (cap == 1) si.anisotropyEnable = VK_FALSE;\n'
               '        else if (cap > 1 && si.anisotropyEnable && si.maxAnisotropy > (float)cap) si.maxAnisotropy = (float)cap;\n'
               '    }\n')
          PY_EOF5
          git diff --stat

      - name: Make this a separate app (so your installed one is not replaced)
        run: |
          sed -i 's|applicationId = "com.botwrecomp.android"|applicationId = "com.botwrecomp.android.test"|' android/botwrecompandroid/app/build.gradle.kts
          grep -n applicationId android/botwrecompandroid/app/build.gradle.kts

      - name: Restore the signing key (so new builds can update the old one)
        id: signkey
        uses: actions/cache@v4
        with:
          path: ~/.botwrecompandroid
          key: signing-key-v1

      - name: Create the signing key (only the first time)
        if: steps.signkey.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.botwrecompandroid
          keytool -genkeypair -keystore ~/.botwrecompandroid/tes
